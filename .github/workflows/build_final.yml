name: Build Grocery Debt APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract clean Flutter project
        shell: bash
        run: |
          set -euo pipefail
          test -f grocery_debt_app.zip || { echo 'ERROR: grocery_debt_app.zip is missing'; exit 1; }
          mkdir -p extracted_project
          unzip -oq grocery_debt_app.zip -d extracted_project
          test -f extracted_project/grocery_debt_app/pubspec.yaml
          test -f extracted_project/grocery_debt_app/lib/main.dart
          cp -a extracted_project/grocery_debt_app/. ./
          test -f lib/widgets/receipt_card.dart
          echo 'Project extracted successfully.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate missing Android platform files
        run: python3 tools/prepare_android.py

      - name: Verify receipt TextDirection fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          f = Path('lib/widgets/receipt_card.dart')
          source = f.read_text(encoding='utf-8')
          old = "import 'package:intl/intl.dart';"
          new = "import 'package:intl/intl.dart' show DateFormat, NumberFormat;"
          if old in source:
              source = source.replace(old, new)
              f.write_text(source, encoding='utf-8')
          if new not in source:
              raise SystemExit('ERROR: cannot verify receipt import fix')
          print('Arabic receipt import fixed/verified.')
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Grocery-Debt-App
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
